<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Calculator</h1>
    <div class="container border">
        <input aria-disabled="false" id="input" >
        <div class="box ">
            <button class="box1 display color btn3" onclick="clearing()">AC</button>
            <button id="btn1" class="box1 display color btn3" onclick="removing()">del</button>
            <button class="box1 display color btn3" onclick="rendering('%')">%</button>
            <button class="box1 display color1 btn2" onclick="rendering('/')">/</button>
            <button class="box1 display btn" onclick="rendering('7')">7</button>
            <button class="box1 display btn" onclick="rendering('8')">8</button>
            <button class="box1 display btn" onclick="rendering('9')">9</button>
            <button class="box1 display color1 btn2" onclick="rendering('*')">x</button>
            <button class="box1 display btn" onclick="rendering('4')">4</button>
            <button class="box1 display btn" onclick="rendering('5')">5</button>
            <button class="box1 display btn" onclick="rendering('6')">6</button>
            <button class="box1 display color1 btn2" onclick="rendering('-')">-</button>
            <button class="box1 display btn" onclick="rendering('1')">1</button>
            <button class="box1 display btn" onclick="rendering('2')">2</button>
            <button class="box1 display btn" onclick="rendering('3')">3</button>
            <button class="box1 display color1 btn2" onclick="rendering('+')">+</button>
        </div>
        <div class="box2">
            <button class="box3 sanjay btn" onclick="rendering('0')">0</button>
            <button class="box3 btn" onclick="rendering('.')">.</dibuttonv>
            <button class="box3 color1 btn2" onclick="result()">=</button>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
